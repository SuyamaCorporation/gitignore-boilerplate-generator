<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.gitignore ボイラープレート ジェネレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-4 text-gray-800">.gitignore ボイラープレート ジェネレーター</h1>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Stack Selection -->
    <div class="lg:col-span-1 bg-white rounded-lg shadow p-4">
      <h2 class="text-lg font-semibold mb-3 text-gray-700">技術スタック選択</h2>
      <div id="stackList" class="space-y-2"></div>
      <div class="mt-4">
        <label for="customRules" class="block text-sm font-medium text-gray-700 mb-1">カスタムルール（1行1エントリ）:</label>
        <textarea id="customRules" rows="5" class="w-full border rounded px-2 py-1 text-sm font-mono" placeholder="*.myext&#10;my-secret-file.txt" aria-label="カスタムルール"></textarea>
      </div>
      <button onclick="generate()" class="w-full mt-3 bg-blue-600 text-white rounded px-4 py-2 text-sm hover:bg-blue-700" aria-label="生成する">生成する</button>
    </div>

    <!-- Output -->
    <div class="lg:col-span-2 bg-white rounded-lg shadow p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-gray-700">生成された .gitignore</h2>
        <div class="flex gap-2">
          <button onclick="copyOutput()" class="bg-gray-200 text-gray-700 rounded px-3 py-1 text-sm hover:bg-gray-300" aria-label="コピー">コピー</button>
          <button onclick="downloadOutput()" class="bg-green-600 text-white rounded px-3 py-1 text-sm hover:bg-green-700" aria-label="ダウンロード">ダウンロード</button>
        </div>
      </div>
      <textarea id="output" rows="30" class="w-full border rounded px-3 py-2 text-sm font-mono bg-gray-50" readonly aria-label="生成された.gitignore"></textarea>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const STACKS = {

.env.production.local`

  'Java': {

    rules: `# Java

  'Go': {
    label: 'Go',
    rules: `# Go

  },
  'Rust': {
    label: 'Rust / Cargo',
    rules: `# Rust

  },
  'Swift': {
    label: 'Swift / Xcode',
    rules: `# Swift

  },
  'C++': {
    label: 'C / C++',
    rules: `# C/C++

  'macOS': {
    label: 'macOS',
    rules: `# macOS

    rules: `# Windows

    label: 'Linux',
    rules: `# Linux

  'VSCode': {

    rules: `# VS Code

function renderStacks() {
  const saved = getSaved();
  const container = document.getElementById('stackList');
  Object.entries(STACKS).forEach(([key, info]) => {
    const label = document.createElement('label');
    label.className = 'flex items-center gap-2 cursor-pointer text-sm';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = key;
    cb.id = `stack-${key}`;
    cb.checked = saved.includes(key);
    cb.setAttribute('aria-label', info.label);
    const span = document.createElement('span');
    span.textContent = info.label;
    label.appendChild(cb);
    label.appendChild(span);
    container.appendChild(label);
  });
}

function getSelected() {
  return Array.from(document.querySelectorAll('#stackList input[type=checkbox]:checked')).map(c => c.value);
}

function getSaved() {
  try { return JSON.parse(localStorage.getItem('gitignore-selected') || '[]'); } catch(e) { return []; }
}

function generate() {
  const selected = getSelected();
  localStorage.setItem('gitignore-selected', JSON.stringify(selected));

  const seen = new Set();
  const sections = [];

  selected.forEach(key => {
    if (!STACKS[key]) return;
    const lines = STACKS[key].rules.split('\n');
    const section = [];
    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('#')) {
        section.push(line);
      } else if (!seen.has(trimmed)) {
        seen.add(trimmed);
        section.push(line);
      }
    });
    sections.push(section.join('\n'));
  });

  // Custom rules
  const custom = document.getElementById('customRules').value.trim();
  if (custom) {
    const customLines = ['', '# カスタムルール'];
    custom.split('\n').forEach(line => {
      const trimmed = line.trim();
      if (trimmed && !seen.has(trimmed)) {
        seen.add(trimmed);
        customLines.push(trimmed);
      }
    });
    sections.push(customLines.join('\n'));
  }

  const output = sections.join('\n\n').trim();
  document.getElementById('output').value = output || '# スタックを選択してください';
}

function copyOutput() {
  const txt = document.getElementById('output').value;
  navigator.clipboard.writeText(txt);
  const btn = event.target;
  btn.textContent = 'コピー済！';
  setTimeout(() => btn.textContent = 'コピー', 1500);
}

function downloadOutput() {
  const txt = document.getElementById('output').value;
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '.gitignore';
  a.click();
}

renderStacks();
generate();
</script>
</body>
</html>
